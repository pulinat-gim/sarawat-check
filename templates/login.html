<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สารวัตรCheck - ระบบเช็กชื่อปฏิบัติหน้าที่</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #334155;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            text-align: center;
        }
        .logo-icon {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            color: #1e293b;
            width: 65px;
            height: 65px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8em;
            font-weight: bold;
            margin: 0 auto 15px auto;
        }
        h2 { margin: 0 0 5px 0; color: #0f172a; font-size: 1.5em; }
        p.subtitle { margin: 0 0 25px 0; color: #64748b; font-size: 0.9em; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 0.85em; font-weight: bold; color: #475569; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 14px; box-sizing: border-box; font-size: 0.95em; outline: none; background: #f8fafc; }
        .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-primary { width: 100%; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; padding: 14px; border-radius: 14px; font-size: 1em; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-secondary { width: 100%; background: #f1f5f9; color: #334155; border: none; padding: 12px; border-radius: 14px; font-size: 0.95em; font-weight: bold; cursor: pointer; margin-top: 10px; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .advance-leave-link { margin-top: 18px; font-size: 0.85em; }
        .advance-leave-link a { color: #d97706; text-decoration: none; font-weight: bold; cursor: pointer; }
        #alertBox { margin-top: 15px; padding: 12px; border-radius: 12px; font-size: 0.9em; display: none; }
        .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: white; width: 100%; max-width: 420px; border-radius: 24px; padding: 25px; text-align: left; box-sizing: border-box; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .close-btn { background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: #475569; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-icon">✓</div>
        <h2>สารวัตรCheck</h2>
        <p class="subtitle">ระบบเช็กชื่อ ณ วัดบึงพระ</p>
        
        <div class="input-group">
            <label>ชื่อเล่น หรือ ชื่อ-นามสกุล</label>
            <input type="text" id="keywordInput" class="form-control" placeholder="เช่น กร หรือชื่อเต็ม">
        </div>

        <button class="btn-primary" onclick="handleCheckIn()">📍 เช็กชื่อเข้าปฏิบัติหน้าที่</button>
        <a href="/dashboard" class="btn-secondary">📊 ไปหน้าแดชบอร์ดสรุปผล</a>

        <div class="advance-leave-link">
            <a onclick="openLeaveModal()">📝 แจ้งลาล่วงหน้า / ลายาวหลายวัน</a>
        </div>

        <div id="alertBox"></div>
    </div>

    <div id="leaveModal" class="modal-overlay" onclick="closeLeaveModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>📝 ระบบแจ้งลาล่วงหน้า</h3>
                <button class="close-btn" onclick="closeLeaveModal()">&times;</button>
            </div>
            <div class="input-group">
                <label>ชื่อสมาชิก</label>
                <input type="text" id="leaveKeyword" class="form-control" placeholder="เช่น กร">
            </div>
            <div class="date-row">
                <div class="input-group">
                    <label>ตั้งแต่วันที่</label>
                    <input type="date" id="leaveStartDate" class="form-control">
                </div>
                <div class="input-group">
                    <label>ถึงวันที่</label>
                    <input type="date" id="leaveEndDate" class="form-control">
                </div>
            </div>
            <div class="input-group">
                <label>เหตุผลการลา</label>
                <input type="text" id="leaveNote" class="form-control" placeholder="เช่น ลาป่วย">
            </div>
            <button class="btn-primary" style="background: #0284c7;" onclick="submitLeave()">📤 ยืนยันการแจ้งลา</button>
            <div id="leaveAlert" style="margin-top: 10px; font-size: 0.85em; text-align: center;"></div>
        </div>
    </div>

    <script>
        function showAlert(msg, isSuccess) {
            const box = document.getElementById('alertBox');
            box.style.display = 'block';
            box.className = isSuccess ? 'alert-success' : 'alert-error';
            box.innerText = msg;
        }

        async function handleCheckIn() {
            const keyword = document.getElementById('keywordInput').value.trim();
            if (!keyword) {
                showAlert('กรุณากรอกชื่อก่อนเช็กชื่อครับ', false);
                return;
            }

            showAlert('กำลังดึงพิกัด GPS วัดบึงพระ...', true);

            if (!navigator.geolocation) {
                sendCheckInRequest(keyword, 16.7625, 100.2611);
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    sendCheckInRequest(keyword, lat, lng);
                },
                (error) => {
                    console.warn('GPS Error, using fallback:', error);
                    sendCheckInRequest(keyword, 16.7625, 100.2611);
                },
                { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
            );
        }

        async function sendCheckInRequest(keyword, lat, lng) {
            try {
                const res = await fetch('/api/action/checkin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword, lat, lng })
                });
                const data = await res.json();
                showAlert(data.message, data.ok);
                if (data.ok) {
                    setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
                }
            } catch (err) {
                showAlert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์', false);
            }
        }

        function openLeaveModal() {
            document.getElementById('leaveStartDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('leaveEndDate').value = '';
            document.getElementById('leaveModal').classList.add('show');
        }

        function closeLeaveModal() {
            document.getElementById('leaveModal').classList.remove('show');
            document.getElementById('leaveAlert').innerText = '';
        }

        async function submitLeave() {
            const keyword = document.getElementById('leaveKeyword').value.trim();
            const startDate = document.getElementById('leaveStartDate').value;
            const endDate = document.getElementById('leaveEndDate').value;
            const note = document.getElementById('leaveNote').value.trim();
            const alertDiv = document.getElementById('leaveAlert');

            if (!keyword || !startDate || !note) {
                alertDiv.style.color = '#dc2626';
                alertDiv.innerText = 'กรุณากรอกข้อมูลให้ครบ';
                return;
            }
            try {
                const res = await fetch('/api/action/leave', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword, startDate, endDate, note })
                });
                const data = await res.json();
                alertDiv.style.color = data.ok ? '#16a34a' : '#dc2626';
                alertDiv.innerText = data.message;
                if (data.ok) {
                    setTimeout(() => { closeLeaveModal(); window.location.href = '/dashboard'; }, 1500);
                }
            } catch (err) {
                alertDiv.style.color = '#dc2626';
                alertDiv.innerText = 'เกิดข้อผิดพลาดในการบันทึก';
            }
        }
    </script>
</body>
</html>
